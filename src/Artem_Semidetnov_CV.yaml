        end_date: 2024

    research interests:
      - bullet: Categorical homotopy theory; simplicial methods and operads; homotopy type theory and computer-formalized approaches; geometric and combinatorial group theory.

    publications and preprints:
      - name: Operadic double dual (preprint in preparation)
        summary: 'Arshak Aivazian, Emmanuel Farjoun, Vasily Ionin, ***Artem Semidetnov***'
      - name: '[An explicit non-elementary matrix over a bivariate Laurent polynomial ring](https://arxiv.org/abs/2609.04275)'
        summary: 'Vasily Ionin, ***Artem Semidetnov*** · [arXiv:2609.04275](https://arxiv.org/abs/2609.04275)'
        date: 2026-09
      - name: '[On Some More Problems from the Kourovka Notebook](https://arxiv.org/abs/2608.29219)'
        summary: 'Vasily Ionin, ***Artem Semidetnov*** · [arXiv:2608.29219](https://arxiv.org/abs/2608.29219)'
        date: 2026-08
      - name: '[The stable commutator length of a relator is not a one-relator group invariant](https://arxiv.org/abs/2608.21465)'
        summary: '***Artem Semidetnov*** · [arXiv:2608.21465](https://arxiv.org/abs/2608.21465)'
        date: 2026-08
      - name: '[The operad associated to a crossed simplicial group](https://arxiv.org/abs/2512.14498)'
        summary: '***Artem Semidetnov*** · [arXiv:2512.14498](https://arxiv.org/abs/2512.14498)'
        date: 2025-12
      - name: '[On the geometry of free nilpotent groups](https://arxiv.org/abs/2106.00095)'
        summary: '***Artem Semidetnov***, Ruslan Magdiev · [arXiv:2106.00095](https://arxiv.org/abs/2106.00095)'
        date: 2021-05

    research experience / projects:
      - name: '[On Simplicial Resolutions for Link Groups](https://artem.semidetnov.com/projects/on-simplicial-resolutions-for-link-groups.pdf)'
        summary: 'Independent mathematical note presenting two proofs of the Lei-Li-Wu theorem on a simplicial resolution of link groups.'
        date: 2026-10
      - name: JetBrains - Research Intern, HoTT and Dependent Types Lab
        location: Pafos, Cyprus
        date: June 2024 - Sept 2024
        highlights:
          - Developed the official Arend library and formalized results in algebra and homotopy type theory.
          - Formalized the Eckmann-Hilton argument, Eilenberg-Mac Lane spaces, homology of types, group automorphisms, Schur's lemma, Maschke's lemma, and characterizations of group actions; selected contributions shipped in [Arend 1.10](https://arend-lang.github.io/2024/07/05/Arend-1.10.0-released.html).
    selected talks:
      - name: '[The operad associated to a crossed simplicial group](https://www.math.ku.dk/english/calendar/events/ytm26/YTM_2026_no_friday_closing.pdf)'
        date: 2026-07
