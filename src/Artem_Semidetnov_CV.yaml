        date: 2024
        location: Nizhny Novgorod, Russia
      - name: '[On the Poisson boundary of lamplighter groups](https://m.mathnet.ru/php/seminars.phtml?option_lang=rus&presentid=34355)'
        highlights:
          - St. Petersburg Seminar on Representation Theory and Dynamical Systems
        location: Saint Petersburg, Russia
      - name: On the geometry of free nilpotent groups
        location: Novosibirsk, Russia
        highlights:
          - Siberian Summer Conference
        date: 2021

    honors and awards:
      - name: '[Excellence Master Fellowship, University of Geneva](https://www.unige.ch/sciences/en/enseignements/formations/masters/excellencemasterfellowships/winners-2025)'
        start_date: 2025
        end_date: 2027
      - name: Rodnye Goroda Scholarship
        start_date: 2023
        end_date: 2024
      - name: JetBrains Scholarship, Neapolis University Pafos
        start_date: 2022
        end_date: 2024
      - name: '[Chebyshev Laboratory Travel Grant, Winter School in Mathematics and Theoretical Computer Science](https://math.hse.ru/announcements/981291875.html)'
        date: 2025

    teaching experience:
      - company: Sirius Educational Center
        position: Teaching Assistant, [Groups of Intermediate Growth](https://sochisirius.ru/obuchenie/nauka/smena1783/8258)
        location: Sochi, Russia
        start_date: 2024-04
        end_date: 2024-05
      - company: Mathematics and Computer Science Faculty Program for Prospective Students
        position: Teaching Assistant, Braid and Knot Theory
        location: Saint Petersburg, Russia
        date: 2023-06
      - company: Laboratory for Continuous Mathematical Education
        position: Mathematics Teacher for Gifted Students
        location: Saint Petersburg, Russia
        start_date: 2021
        end_date: 2023

    work experience:
      - company: JetBrains
        position: Research Intern, HoTT and Dependent Types Lab
        location: Remote
        start_date: 2025-11
        end_date: 2026-04
        highlights:
          - Designed and developed an MCP server for the Arend proof assistant, exposing typechecking and IDE functionality to AI coding agents.
          - Integrated the MCP server with the Arend plugin for IntelliJ IDEA and built an experimental Arend coding agent using Koog.
          - Fine-tuned models for Arend code completion.
      - company: IPONWEB (acquired by Criteo)
        position: Machine Learning Intern
        location: Pafos, Cyprus
        start_date: 2023-05
        end_date: 2023-09
        highlights:
          - Reverse-engineered the behavior of a Criteo ML system that analyzes websites and produces word2vec representations; evaluated potential applications.

    workshops, service and additional information:
      - name: '[Teaching Higher Category Theory with Computers](https://icerm.brown.edu/program/topical_workshop/tw-26-thc)'
        summary: Funded participant.
        date: 2026-08
        location: ICERM, Brown University, Providence, RI
      - name: Academic Service and Outreach
        highlights:
          - Organizer of the [Euler International Mathematical Institute Functional Analysis Seminar](https://indico.eimi.ru/category/102/).
          - Invited judge, Saint Petersburg Tournament of Young Mathematicians (since 2021) and International Tournament of Young Mathematicians (2024, 2025).
          - '[Problem author](https://drive.google.com/file/d/1d4dqKrTKG6MI_cYQwnos8iDJWCuVIs4I/view), ITYM 2024; [Scientific Organizing Committee](https://eteam.tfjm.org/about-us-2025/), ETEAM 2025.'
      - name: Additional Information
        summary: Intel ISEF finalist (2020); English C1 (IELTS 8.0/9, taken in 2020 and 2024).

