        end_date: 2024

    technical skills:
      - bullet: '**Formal verification:** Arend, dependent type theory, theorem formalization, typechecking, and IDE integration.'
      - bullet: '**AI and machine learning:** LLM coding agents, model fine-tuning, code completion, MCP servers, and word2vec analysis.'
      - bullet: '**Languages:** English C1 (IELTS 8.0/9).'

    work experience:
      - company: JetBrains
        position: Research Intern in HoTT and Dependent Types Lab
        location: Remote
        start_date: 2025-11
        end_date: 2026-04
        highlights:
          - Built AI-assisted development features for Arend, including MCP servers exposing typechecking and IDE functionality; contributed to the Arend plugin for IntelliJ IDEA.
          - Built an experimental LLM coding agent for generating Arend code using the Koog framework.
          - Fine-tuned models for Arend code completion.
      - company: JetBrains
        position: Research Intern in HoTT and Dependent Types Lab
        location: Pafos, Cyprus
        start_date: 2024-06
        end_date: 2024-09
        highlights:
          - Contributed formalized results in algebra and homotopy type theory to the official Arend library.
          - Formalized the Eckmann-Hilton argument, Eilenberg-MacLane spaces, and homology of types.
          - Formalized group automorphisms, Schur's Lemma, Maschke's Lemma, and characterizations of group actions; selected contributions shipped in [Arend 1.10](https://arend-lang.github.io/2024/07/05/Arend-1.10.0-released.html).
      - company: IPONWEB (acquired by Criteo)
        position: Machine Learning Intern
        location: Pafos, Cyprus
        start_date: 2023-05
        end_date: 2023-09
        highlights:
          - Reverse-engineered the behavior of a Criteo ML system that analyzes websites and produces word2vec representations; evaluated potential applications.

    AI-Assisted Mathematical Research:
      - title: '[On Some More Problems from the Kourovka Notebook](https://arxiv.org/abs/2608.29219)'
        authors:
          - Vasily Ionin
          - '***Artem Semidetnov***'
        doi: https://doi.org/10.48550/arXiv.2608.29219
        date: 2026-08-29
      - title: '[The stable commutator length of a relator is not a one-relator group invariant](https://arxiv.org/abs/2608.21465)'
        authors:
          - '***Artem Semidetnov***'
        doi: https://doi.org/10.48550/arXiv.2608.21465
        date: 2026-08-21

    publications:
      - title: '[The operad associated to a crossed simplicial group](https://arxiv.org/pdf/2512.14498)'
        authors:
          - '***Artem Semidetnov***'
        doi: https://doi.org/10.48550/arXiv.2512.14498
        date: 2025-12-16
      - title: '[On the geometry of free nilpotent groups](https://arxiv.org/pdf/2106.00095)'
        authors:
          - '***Artem Semidetnov***'
          - Ruslan Magdiev
        doi: https://doi.org/10.48550/arXiv.2106.00095
        date: 2021-05-31

