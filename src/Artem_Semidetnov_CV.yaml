cv:
  name: Artem Semidetnov
  location: Geneva, Switzerland
  email: artemsemidetnov@gmail.com
  website: https://artem.semidetnov.com/
  social_networks:
    - network: GitHub
      username: s3midetnov
  sections:
    # welcome_to_RenderCV!:
    #   - '[RenderCV](https://github.com/sinaatalay/rendercv) is
    #     a LaTeX-based CV/resume framework. It allows you to create
    #     a high-quality CV or resume as a PDF file from a YAML
    #     file, with **full Markdown syntax support** and **complete
    #     control over the LaTeX code**.'
    #   - The boilerplate content was inspired by [Gayle McDowell](https://github.com/dnl-blkv/mcdowell-cv).
    # quick_guide:
    #   - bullet: Each section title is arbitrary and each section
    #       contains a list of entries.
    #   - bullet: 'There are 7 unique entry types: *BulletEntry*,
    #       *TextEntry*, *EducationEntry*, *ExperienceEntry*, *NormalEntry*,
    #       *PublicationEntry*, and *OneLineEntry*.'
    #   - bullet: Select a section title, pick an entry type, and
    #       start writing your section!
    #   - bullet: '[Here](https://docs.rendercv.com/user_guide/),
    #       you can find a comprehensive user guide for RenderCV.
    profile:
      - Mathematician and research engineer building proof-assistant tooling and AI systems for formal mathematics. My experience spans typechecker development, IDE integrations, formalization, and original mathematical research.

    technical skills:
      - bullet: '**Formal methods:** category theory, homotopy type theory, dependent type theory, proof assistants.'
      - bullet: '**Programming:** Kotlin, Python, Java, SQL, Haskell; typechecking, language tooling, IntelliJ Platform.'
      - bullet: '**AI engineering:** MCP, LLM coding agents, model fine-tuning, code completion, evaluation.'
      - bullet: '**Languages:** Russian (native), English C1 (IELTS 8.0/9), French (conversational).'

    education:
      - institution: University of Geneva
        area: Mathematics
        degree: MSc
        start_date: 2025
        end_date: 2027
      - institution: Saint Petersburg State University
        area: Mathematics
        degree: BSc
        start_date: 2021
        end_date: 2025
      - institution: Neapolis University Pafos
        area: Applied Computer Science, JetBrains Program
        degree: BSc
        start_date: 2022
        end_date: 2024

    work experience:
      - company: JetBrains
        position: Research Intern in HoTT and Dependent Types Lab
        location: Remote
        start_date: 2025-11
        end_date: 2026-04
        highlights:
          - Developed an MCP server for the Arend proof assistant, exposing typechecking and IDE functionality to LLM coding agents.
          - Integrated the server with the Arend plugin for IntelliJ IDEA and contributed plugin changes.
          - Built an experimental LLM coding agent for Arend using Koog; fine-tuned models for Arend code completion.
      - company: JetBrains
        position: Research Intern in HoTT and Dependent Types Lab
        location: Pafos, Cyprus
        start_date: 2024-06
        end_date: 2024-09
        highlights:
          - Contributed formalized results in algebra and homotopy type theory to the official Arend library.
          - Formalized the Eckmann-Hilton argument, Eilenberg-MacLane spaces, homology of types, group automorphisms, Schur's Lemma, Maschke's Lemma, and characterizations of group actions; selected work shipped in [Arend 1.10](https://arend-lang.github.io/2024/07/05/Arend-1.10.0-released.html).
      - company: IPONWEB (acquired by Criteo)
        position: Machine Learning Intern
        location: Pafos, Cyprus
        start_date: 2023-05
        end_date: 2023-09
        highlights:
          - Reverse-engineered a Criteo ML system that analyzes websites and produces word2vec representations; evaluated potential applications.

    research and engineering:
      - name: '[Rzk proof assistant and sHoTT library](https://github.com/rzk-lang)'
        location: Open source
        start_date: 2026-08
        end_date: present
        highlights:
          - Contribute to an experimental proof assistant for synthetic infinity-categories across its Haskell typechecker and Rzk formalization library.
          - Implemented identity-type inference from either endpoint, expanded error diagnostics, and added regression tests in an [open pull request](https://github.com/rzk-lang/rzk/pull/363).
          - Formalized that precomposition with an equivalence is an equivalence in the [sHoTT library](https://github.com/rzk-lang/sHoTT/pull/196).
      - name: '[The operad associated to a crossed simplicial group](https://arxiv.org/abs/2512.14498)'
        summary: '***Artem Semidetnov*** · [doi:10.48550/arXiv.2512.14498](https://doi.org/10.48550/arXiv.2512.14498)'
        date: 2025-12-16
      - name: '[On the geometry of free nilpotent groups](https://arxiv.org/abs/2106.00095)'
        summary: '***Artem Semidetnov***, Ruslan Magdiev · [doi:10.48550/arXiv.2106.00095](https://doi.org/10.48550/arXiv.2106.00095)'
        date: 2021-05-31
      - name: AI-Assisted Mathematical Research
        highlights:
          - '[An explicit non-elementary matrix over a bivariate Laurent polynomial ring](https://arxiv.org/abs/2609.04275) - Vasiliy Ionin, ***Artem Semidetnov*** (Sept 2026).'
          - '[On Some More Problems from the Kourovka Notebook](https://arxiv.org/abs/2608.29219) - Vasily Ionin, ***Artem Semidetnov*** (Aug 2026).'
          - '[The stable commutator length of a relator is not a one-relator group invariant](https://arxiv.org/abs/2608.21465) - ***Artem Semidetnov*** (Aug 2026).'

    research interests:
      - bullet: Categorical homotopy theory; homotopy type theory and computer-verified mathematics; simplicial methods and operads; AI-assisted mathematical reasoning; geometric and combinatorial group theory.

    awards and selected activities:
      - '[Excellence Master Fellowship at the University of Geneva](https://www.unige.ch/sciences/en/enseignements/formations/masters/excellencemasterfellowships/winners-2025)'
      - JetBrains Scholarship at Neapolis University Pafos
      - 'Funded participant at [Teaching Higher Category Theory with Computers](https://icerm.brown.edu/program/topical_workshop/tw-26-thc), ICERM, Brown University, 2026.'

    selected talks:
      - name: '[The operad associated to a crossed simplicial group](https://www.math.ku.dk/english/calendar/events/ytm26/YTM_2026_no_friday_closing.pdf)'
        date: 2026-07
        highlights:
          - Young Topologists Meeting 2026, Copenhagen
      - name: '[Plus construction and simplicial methods](https://cs.hse.ru/mirror/pubs/share/1075346122)'
        date: 2025-08
        highlights:
          - Algebraic Topology, Geometry, Combinatorics, and Data Analysis, Pushkin
      - name: '[Twisting numbers on braid and Thompson groups](https://disk.yandex.ru/i/52gkQhVjjRravA)'
        date: 2024
        highlights:
          - Topological Methods in Dynamics and Related Topics VII, Nizhny Novgorod
    
design:
  theme: classic
  page:
    size: us-letter
    top_margin: 1.6cm
    bottom_margin: 1.6cm
    left_margin: 2cm
    right_margin: 2cm
    show_page_numbering: true
    show_last_updated_date: true
  colors:
    text: black
    name: '#004f90'
    connections: '#004f90'
    section_titles: '#004f90'
    links: '#004f90'
    last_updated_date_and_page_numbering: grey
  text:
    font_family: Source Sans 3
    font_size: 10pt
    leading: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
  links:
    underline: false
    use_external_link_icon: true
  header:
    name_font_size: 30pt
    name_bold: true
    photo_width: 3.5cm
    vertical_space_between_name_and_connections: 0.7cm
    vertical_space_between_connections_and_first_section: 0.7cm
    horizontal_space_between_connections: 0.5cm
    separator_between_connections: ''
    use_icons_for_connections: true
    alignment: center
  section_titles:
    type: with-parial-line
    font_size: 1.4em
    bold: true
    small_caps: false
    line_thickness: 0.5pt
    vertical_space_above: 0.4cm
    vertical_space_below: 0.25cm
  entries:
    date_and_location_width: 4.15cm
    left_and_right_margin: 0.2cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 1em
    allow_page_break_in_entries: false
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: •
    top_margin: 0.25cm
    left_margin: 0.4cm
    vertical_space_between_highlights: 0.25cm
    horizontal_space_between_bullet_and_highlight: 0.5em
    summary_left_margin: 0cm
  entry_types:
    one_line_entry:
      template: '**LABEL:** DETAILS'
    education_entry:
      main_column_first_row_template: '**INSTITUTION**, AREA'
      degree_column_template: '**DEGREE**'
      degree_column_width: 1cm
      main_column_second_row_template: "SUMMARY\nHIGHLIGHTS"
      date_and_location_column_template: "LOCATION\nDATE"
    normal_entry:
      main_column_first_row_template: '**NAME**'
      main_column_second_row_template: "SUMMARY\nHIGHLIGHTS"
      date_and_location_column_template: "LOCATION\nDATE"
    experience_entry:
      main_column_first_row_template: '**COMPANY**, POSITION'
      main_column_second_row_template: "SUMMARY\nHIGHLIGHTS"
      date_and_location_column_template: "LOCATION\nDATE"
    publication_entry:
      main_column_first_row_template: '**TITLE**'
      main_column_second_row_template: "AUTHORS\nURL (JOURNAL)"
      main_column_second_row_without_journal_template: "AUTHORS\n\
        URL"
      main_column_second_row_without_url_template: "AUTHORS\n\
        JOURNAL"
      date_and_location_column_template: DATE
